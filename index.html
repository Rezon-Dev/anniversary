<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Anniversary | Amma & Abba</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Scissor Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-rose: #ff758c;
            --secondary-rose: #ff7eb3;
            --dark-rose: #880e4f;
            --glass: rgba(255, 255, 255, 0.15);
            --gold: #ffd700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            color: white;
        }

        /* --- Intro Animation Styles --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease;
        }

        .glow-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ribbon-container {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .ribbon-left, .ribbon-right {
            position: absolute;
            height: 40px;
            width: 50%;
            background: linear-gradient(90deg, var(--primary-rose), var(--secondary-rose));
            box-shadow: 0 0 20px rgba(255, 117, 140, 0.5);
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.3, 1);
        }

        .ribbon-left { left: 0; border-radius: 0 5px 5px 0; }
        .ribbon-right { right: 0; border-radius: 5px 0 0 5px; }

        .scissor {
            position: absolute;
            z-index: 1001;
            font-size: 3rem;
            color: white;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
            transition: all 0.5s ease;
            transform: rotate(-90deg);
            cursor: pointer;
            animation: scissorWait 2s infinite ease-in-out;
        }

        @keyframes scissorWait {
            0%, 100% { transform: rotate(-90deg) scale(1); }
            50% { transform: rotate(-90deg) scale(1.1); }
        }

        .cut-instruction {
            position: absolute;
            bottom: 20%;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.8rem;
            opacity: 0.8;
            animation: pulse 2s infinite;
        }

        /* --- Main Website Styles --- */
        #main-content {
            opacity: 0;
            visibility: hidden;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: opacity 2s ease;
        }

        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.1;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 90%;
            max-width: 400px;
            padding: 40px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 45px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
            transform: scale(0.8);
            transition: transform 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        #main-content.active .glass-card {
            transform: scale(1);
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(136, 14, 79, 0.3);
            margin-bottom: 10px;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            margin: 15px 0;
            color: var(--dark-rose);
            display: block;
        }

        .subtitle {
            font-family: 'Great Vibes', cursive; /* User requested same font as names */
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--dark-rose);
            margin-top: -10px;
            display: block;
        }

        .anniversary-year {
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            background: var(--primary-rose);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 50px;
            margin: 15px 0;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
        }

        .message {
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 20px 0;
            color: #555;
            font-weight: 400;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--dark-rose);
            font-weight: 700;
        }

        /* --- Animations --- */
        .heart {
            position: absolute;
            color: rgba(255, 117, 140, 0.6);
            font-size: 20px;
            pointer-events: none;
            z-index: 1;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1002;
        }

        .cut-action {
            animation: scissorCut 0.5s forwards ease-in;
        }

        @keyframes scissorCut {
            0% { transform: rotate(-90deg) translateX(0); }
            100% { transform: rotate(-90deg) translateX(50px); opacity: 0; }
        }

        /* Heart Pulse for Card */
        .heart-icon {
            color: var(--primary-rose);
            font-size: 2rem;
            animation: heartBeat 1.5s infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Intro Animation Screen -->
    <div id="intro-overlay">
        <canvas class="glow-particles" id="introCanvas"></canvas>
        <div class="ribbon-container" onclick="handleCut()">
            <div class="ribbon-left" id="ribL"></div>
            <div class="ribbon-right" id="ribR"></div>
            <i class="fas fa-scissors scissor" id="scissorIcon"></i>
        </div>
        <div class="cut-instruction">Tap the scissor to open</div>
    </div>

    <!-- Main Content Reveal -->
    <div id="main-content">
        <div class="animated-bg"></div>
        <div id="particles-js"></div>
        
        <div class="glass-card">
            <div class="heart-icon"><i class="fas fa-heart"></i></div>
            <h1>Happy Anniversary</h1>
            
            <div class="names">Najrul & Rejina</div>
            <div class="subtitle">Amma & Abba</div>
            
            <div class="anniversary-year">15 Beautiful Years Together</div>
            
            <p class="message">
                To the most beautiful couple who defined love for us. 
                May your bond grow stronger with every passing sunset. 
                Thank you for being our guiding light and our home.
            </p>

            <footer>
                With Love ❤️<br>
                Rezon & Nilu
            </footer>
        </div>
    </div>

    <script>
        // --- Intro Logic ---
        function handleCut() {
            const music = document.getElementById('bgMusic');
            const scissor = document.getElementById('scissorIcon');
            const ribL = document.getElementById('ribL');
            const ribR = document.getElementById('ribR');
            const intro = document.getElementById('intro-overlay');
            const main = document.getElementById('main-content');

            // Play Music
            music.play().catch(e => console.log("Autoplay blocked, but user interacted. Playing..."));

            // Scissor Animation
            scissor.classList.add('cut-action');

            // Ribbon Animation
            setTimeout(() => {
                ribL.style.transform = 'translateX(-100%)';
                ribR.style.transform = 'translateX(100%)';
                createSparkles();
            }, 300);

            // Transition to Main Content
            setTimeout(() => {
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                    main.style.opacity = '1';
                    main.style.visibility = 'visible';
                    main.classList.add('active');
                    startHeartRain();
                }, 1000);
            }, 800);
        }

        // --- Sparkle Effect ---
        function createSparkles() {
            for (let i = 0; i < 50; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                const size = Math.random() * 5 + 2;
                sparkle.style.width = size + 'px';
                sparkle.style.height = size + 'px';
                sparkle.style.left = '50%';
                sparkle.style.top = '50%';
                
                const destinationX = (Math.random() - 0.5) * 600;
                const destinationY = (Math.random() - 0.5) * 600;

                document.body.appendChild(sparkle);

                const anim = sparkle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${destinationX}px, ${destinationY}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                });

                anim.onfinish = () => sparkle.remove();
            }
        }

        // --- Heart Floating Animation ---
        function startHeartRain() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                document.getElementById('main-content').appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }, 400);
        }

        // --- Background Particle Canvas ---
        const canvas = document.getElementById('introCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = 'rgba(255, 117, 140, 0.5)';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.005;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < 100; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                if (particlesArray[i].size <= 0.2) {
                    particlesArray.splice(i, 1);
                    i--;
                    particlesArray.push(new Particle());
                }
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Fallback: If browser prevents autoplay despite interaction, try again on first body touch
        document.body.addEventListener('touchstart', function() {
            const music = document.getElementById('bgMusic');
            if(music.paused) music.play();
        }, {once: true});
    </script>
</body>
</html>
